<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Santiago Pulido Castaño</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Santiago Pulido Castaño">
  <link rel="stylesheet" href="cssestilos.css">
</head>
<body>
  <nav>
    <ul>
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#comunicate">Comunicate</a></li>
      <li><a href="#derechos">Derechos de Autor</a></li>
    </ul>
    <button id="modoToggle">🌙</button>

  </nav>

  <header id="inicio">
    <div class="encabezado">
      <div class="texto-header">
        <h1>Santiago Pulido Castaño</h1>
        <p class="subtitulo">Desarrollador Web</p>
      </div>
    </div>
  </header>

  <main>
    <section class="comunicate" id="comunicate">
      <div class="comunicate-texto">
        <h2>Comunicate conmigo</h2>
        <form id="formSolicitud">
          <input type="text" id="nombre" placeholder="Nombre" required>
          <input type="email" id="email" placeholder="Correo electrónico" required>
          <input type="text" id="message" placeholder="Mensaje" required>
          <div class="botones">
            <button type="submit">Enviar</button>
          </div>
        </form>
      </div>
    </section>
  <footer>
    <div class="derechos" id="derechos">
      <h2>Derechos de Autor</h2>
      <p>Todos los derechos reservados © 2026 Santiago Pulido Castaño</p>
    <p>Desarrollado por Santiago Pulido Castaño</p>
  </footer>
  <script src="functions.js"></script>
</body>
</html>
